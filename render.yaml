services:
  - type: web
    name: fattabyano-factchecking-system
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: node .output/server/index.mjs
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: LOVABLE_API_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: DEFAME_API_URL
        sync: false
      - key: DEFAME_API_KEY
        sync: false
